# Chargé automatiquement par « docker compose up » : mode TP, site en HTTP.
# Pour HTTPS, utiliser docker-compose.https.yml à la place de ce fichier.
services:
  api:
    ports:
      - "127.0.0.1:5001:5000"     # API joignable depuis l'hôte seulement (curl, Postman)
  web:
    ports:
      - "${WEB_PORT:-8080}:5000"  # le site : http://<machine>:8080
